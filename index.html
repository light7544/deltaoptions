<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Delta Options Chain</title>
<style>
  :root {
    --bg: #0e0f11;
    --panel: #16171a;
    --border: #2a2b2e;
    --text: #e6e6e6;
    --muted: #8a8d93;
    --green: #1b5e3a;
    --green-text: #6fe3a4;
    --red: #5e1b1b;
    --red-text: #ff8080;
    --orange: #c98a1a;
    --call-col: #171b17;
    --put-col: #1b1717;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    margin: 0;
    padding: 20px;
  }
  h1 { font-size: 20px; margin: 0 0 4px 0; }
  .status-bar {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 14px;
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .status-bar .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green-text);
    display: inline-block;
  }
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 6px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
  }
  .tab.active {
    color: var(--text);
    border-color: var(--orange);
    background: #221c10;
  }
  .metrics {
    display: flex;
    gap: 24px;
    margin: 10px 0 14px 0;
    font-size: 13px;
    color: var(--muted);
  }
  .metrics b { color: var(--text); }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    background: var(--panel);
  }
  th {
    text-align: right;
    padding: 8px 10px;
    color: var(--muted);
    font-weight: 500;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th.strike-col, td.strike-col { text-align: center; }
  td {
    text-align: right;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td.call { background: var(--call-col); }
  td.put { background: var(--put-col); }
  .strike-col {
    font-weight: 600;
    background: #1e1f22 !important;
  }
  .badge {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    display: inline-block;
  }
  .badge.green { background: var(--green); color: var(--green-text); }
  .badge.red { background: var(--red); color: var(--red-text); }
  .badge.neutral { background: #333; color: #ccc; }
  .oi-rank {
    background: var(--orange);
    color: #111;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 4px;
    font-weight: 700;
  }
  .pos { color: var(--green-text); }
  .neg { color: var(--red-text); }
  .empty-note {
    color: var(--muted);
    padding: 40px;
    text-align: center;
  }
</style>
</head>
<body>

<h1 id="title">Options Chain</h1>
<div class="status-bar">
  <span class="dot"></span>
  <span id="status">connecting...</span>
</div>

<div class="tabs" id="tabs"></div>
<div class="metrics" id="metrics"></div>
<div id="tableWrap"></div>

<script>
// =========================================================
// GLOBAL SAFEGUARDS & SIGNALS ENGINE BRIDGE
// =========================================================
window.renderAiSignals = function(chainData) {
  try {
    const signalsView = document.getElementById("aiSignalsView");
    if (signalsView && signalsView.style.display !== "none") {
      if (typeof fetchQuantSignal === "function") {
        fetchQuantSignal();
      }
    }
  } catch (err) {
    console.warn("renderAiSignals non-fatal error:", err);
  }
};

function renderAiSignals(chainData) {
  if (typeof window.renderAiSignals === "function") {
    window.renderAiSignals(chainData);
  }
}

const BUILDUP_CLASS = {
  "Long Buildup": "green",
  "Short Covering": "green",
  "Short Buildup": "red",
  "Long Unwinding": "red",
  "Neutral": "neutral",
  "Insufficient Data": "neutral",
};

let currentExpiry = null;
let chainCache = {};

function fmt(n) {
  if (n === null || n === undefined) return "-";
  return Number(n).toLocaleString(undefined, {maximumFractionDigits: 2});
}

function pctSpan(n) {
  if (n === null || n === undefined) return "-";
  const cls = n > 0 ? "pos" : n < 0 ? "neg" : "";
  const sign = n > 0 ? "+" : "";
  return `<span class="${cls}">${sign}${n.toFixed(2)}%</span>`;
}

function buildupBadge(label) {
  if (!label) return "";
  const cls = BUILDUP_CLASS[label] || "neutral";
  return `<span class="badge ${cls}">${label}</span>`;
}

function oiRankBadge(rank) {
  return rank ? `<span class="oi-rank">OI${rank}</span>` : "";
}

async function fetchStatus() {
  const r = await fetch("/api/status");
  const s = await r.json();
  document.getElementById("title").textContent = `${s.underlying} Options Chain — Delta Exchange`;
  const err = s.last_error ? ` | error: ${s.last_error}` : "";
  document.getElementById("status").textContent =
    `Last fetched: ${s.last_fetched || "-"} | refresh every ${s.poll_seconds}s | ${s.expiry_count} expiries${err}`;
}

async function fetchChain() {
  const r = await fetch("/api/chain");
  chainCache = await r.json();
  const expiries = Object.keys(chainCache).sort();
  renderTabs(expiries);
  if (!currentExpiry || !expiries.includes(currentExpiry)) {
    currentExpiry = expiries[0];
  }
  renderTable(currentExpiry);
  if (typeof window.renderAiSignals === "function") {
    window.renderAiSignals(chainCache[currentExpiry]);
  }
}

function renderTabs(expiries) {
  const wrap = document.getElementById("tabs");
  wrap.innerHTML = "";
  expiries.forEach(exp => {
    const el = document.createElement("div");
    el.className = "tab" + (exp === currentExpiry ? " active" : "");
    el.textContent = exp;
    el.onclick = () => {
      currentExpiry = exp;
      renderTabs(expiries);
      renderTable(exp);
      if (typeof window.renderAiSignals === "function") {
        window.renderAiSignals(chainCache[exp]);
      }
    };
    wrap.appendChild(el);
  });
}

function renderTable(expiry) {
  const payload = chainCache[expiry];
  const metrics = document.getElementById("metrics");
  const wrap = document.getElementById("tableWrap");
  if (!payload || !payload.strikes || payload.strikes.length === 0) {
    metrics.innerHTML = "";
    wrap.innerHTML = `<div class="empty-note">No data yet for ${expiry}. Waiting on next poll...</div>`;
    return;
  }

  metrics.innerHTML = `
    <div>Max OI Call Strike: <b>${fmt(payload.max_oi_call_strike)}</b></div>
    <div>Max OI Put Strike: <b>${fmt(payload.max_oi_put_strike)}</b></div>
  `;

  let rows = "";
  for (const s of payload.strikes) {
    const c = s.call || {};
    const p = s.put || {};
    rows += `<tr>
      <td class="call">${fmt(c.oi)} ${oiRankBadge(c.oi_rank)}</td>
      <td class="call">${pctSpan(c.oi_chg_pct)}</td>
      <td class="call">${buildupBadge(c.buildup)}</td>
      <td class="call">${fmt(c.volume)}</td>
      <td class="call">${fmt(c.price)}</td>
      <td class="strike-col">${fmt(s.strike)}</td>
      <td class="put">${fmt(p.price)}</td>
      <td class="put">${fmt(p.volume)}</td>
      <td class="put">${buildupBadge(p.buildup)}</td>
      <td class="put">${pctSpan(p.oi_chg_pct)}</td>
      <td class="put">${fmt(p.oi)} ${oiRankBadge(p.oi_rank)}</td>
    </tr>`;
  }

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Call OI</th><th>OI Chg%</th><th>Buildup</th><th>Vol</th><th>Price</th>
          <th class="strike-col">Strike</th>
          <th>Price</th><th>Vol</th><th>Buildup</th><th>OI Chg%</th><th>Put OI</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

async function refreshAll() {
  try {
    await fetchStatus();
    await fetchChain();
  } catch (e) {
    document.getElementById("status").textContent = "Error contacting API: " + e;
  }
}

refreshAll();
setInterval(refreshAll, 15000); // poll UI every 15s (backend itself refreshes every 30s)
</script>

</body>
</html>
